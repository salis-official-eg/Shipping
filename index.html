<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#2B2A27">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Salis Shipping">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Salis Shipping</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#3D3B36;--mut:#8A857C;--bg:#F8F7F4;--card:#fff;--line:#EAE7E0;--acc:#5E7F63;--acc2:#E8EFE9;--onacc:#fff;--bad:#C94A4A;--sh:0 1px 2px rgba(61,59,54,.04),0 10px 28px -14px rgba(61,59,54,.14)}
@media(prefers-color-scheme:dark){:root{--ink:#F1EFEA;--mut:#A39E93;--bg:#141412;--card:#1D1C1A;--line:#2E2C28;--acc:#94B097;--acc2:#222B24;--onacc:#141412;--bad:#E26A6A;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.7 'Cairo',Tahoma,sans-serif;padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#34322D,#2A2926);color:#F1EFEA;border-bottom:1px solid rgba(148,176,151,.22);display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));box-shadow:0 10px 28px -18px rgba(0,0,0,.55)}
header::after{content:"";position:absolute;inset-inline:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,#94B097,transparent);opacity:.55}
header .logo{width:40px;height:40px;border-radius:13px;background:rgba(148,176,151,.12);border:1px solid rgba(148,176,151,.3);display:grid;place-items:center;flex:none}
.bt{flex:1;min-width:0;line-height:1.15}.bt b{display:block;font:600 15px 'Outfit','Cairo',sans-serif;letter-spacing:.34em;color:#F6F4EF}.bt small{display:block;font-size:12px;color:#94B097;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#E9E6DF;display:grid;place-items:center;cursor:pointer;flex:none}.ib:active{transform:scale(.94)}.ib svg{width:18px;height:18px}
main{max-width:780px;margin:auto;padding:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 15px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
input,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;outline:0;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
label{display:grid;gap:3px;font-size:13px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0;box-shadow:var(--sh)}
.mut{color:var(--mut);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:10px 16px;background:var(--acc);color:var(--onacc);font-weight:700;text-decoration:none;cursor:pointer;box-shadow:0 8px 18px -10px var(--acc);transition:.15s}
.btn:active{transform:scale(.98)}.btn.s{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.w{background:#25D366;color:#fff}.btn.d{background:var(--bad);color:#fff}.btn:disabled{opacity:.45;pointer-events:none}
.btn.big{flex:1 1 100%;padding:13px 16px;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{border-radius:99px;padding:1px 10px;font-size:12px;color:#fff;white-space:nowrap}
.code{font-weight:700;letter-spacing:.5px;direction:ltr;display:inline-block;font-family:'Outfit','Cairo',sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cash{display:flex;justify-content:space-between;align-items:center;background:var(--acc2);border-radius:14px;padding:10px 14px;margin:10px 0}
.cash b{font:700 22px 'Outfit','Cairo',sans-serif;color:var(--acc)}
.ln{display:grid;grid-template-columns:1fr auto 86px;gap:8px;padding:4px 0;font-size:14px}.ln span:last-child{text-align:left}
.bd{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));inset-inline:16px;margin:auto;max-width:380px;background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:14px;text-align:center;z-index:50;box-shadow:0 12px 30px -10px rgba(0,0,0,.45)}.toast.bad{background:var(--bad);color:#fff}
.login{position:fixed;inset:0;margin:0;padding:28px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow:auto;color:#F1EFEA;background:radial-gradient(120% 80% at 50% 0%,#3F4A40 0%,#2B2A27 55%,#1D1C1A 100%)}
.login>*{width:100%;max-width:380px}
.login .logo{width:88px;height:88px;border-radius:28px;background:rgba(148,176,151,.12);border:1px solid rgba(148,176,151,.3);box-shadow:0 14px 44px -12px rgba(148,176,151,.5);display:grid;place-items:center;margin:0 auto 12px}
.login .wm{font:600 13px 'Outfit',sans-serif;letter-spacing:.42em;color:#94B097;text-align:center;margin:0 0 4px;padding-inline-start:.42em}
.login h1{color:#F6F4EF;font-weight:800;text-align:center;font-size:23px;margin:0 0 2px}
.login .mut{text-align:center;color:#ABA79D;margin:2px 0 14px}
.login .card{--bg:#F4F2EC;--line:#E2DED4;--ink:#3D3B36;--mut:#8A857C;--card:#FBFAF7;--acc:#5E7F63;--onacc:#fff;background:#FBFAF7;color:#3D3B36;border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:20px;box-shadow:0 30px 70px -24px rgba(0,0,0,.65)}
.login .row{margin-top:18px}
</style>
</head>
<body>
<div id="app"></div>
<script src="supabase.js"></script>
<script>
const SB='https://pkgkyfaeabcaxpoawsso.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBrZ2t5ZmFlYWJjYXhwb2F3c3NvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5Nzg1OTgsImV4cCI6MjExMDU1NDU5OH0.rgT2x_dzf6wD4dr89iRYiuV3CY6dPN-L9a4G5JLuy_8';
const db=supabase.createClient(SB,KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}}),$=s=>document.querySelector(s);
const x=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const M=n=>Number(n||0).toLocaleString('ar-EG')+' ج.م';
const when=d=>new Date(d).toLocaleString('ar-EG',{timeZone:'Africa/Cairo',dateStyle:'medium',timeStyle:'short'});
const oc=id=>'SL-'+String(id).padStart(4,'0');
const wa=p=>{const d=String(p||'').replace(/\D/g,'');return 'https://wa.me/'+(d[0]=='0'?'2'+d:d)};
const ST={new:['بانتظار التأكيد','#2563eb'],confirmed:['مؤكد — جاهز للشحن','#d97706'],shipped:['في الشحن','#7c3aed'],delivered:['تم التسليم','#059669'],cancelled:['ملغي','#dc2626']};
const TABS=[['new','بانتظار التأكيد'],['confirmed','جاهز للشحن'],['shipped','في الشحن'],['delivered','تم التسليم'],['cancelled','ملغي']];
const LOGO=(z=26)=>`<svg viewBox="0 0 100 100" width="${z}" height="${z}" fill="none" aria-hidden="true"><path d="M44 35C44 27 36 23 29 26C22 29 22 39 29 44C36 49 46 53 45 63C44 72 34 76 26 73C19 70 18 63 21 58" stroke="#94B097" stroke-width="9" stroke-linecap="round"/><path d="M45 55C58 52 72 41 72 26C72 16 63 13 57 20C50 28 49 52 60 66C68 75 79 71 85 63" stroke="#94B097" stroke-width="9" stroke-linecap="round"/></svg>`;
const ICO={refresh:'<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/>'};
const icn=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICO[k]}</svg>`;
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const S={tok:ls.get('salis_ship_tok'),name:ls.get('salis_ship_name')||'',orders:[],tab:'new',q:'',open:null,seen:false,busy:false};
function toast(m,bad){document.querySelectorAll('.toast').forEach(e=>e.remove());const t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3200)}

/* ---------- الدخول ---------- */
function login(msg){
 $('#app').innerHTML=`<div class=login><div class=logo>${LOGO(50)}</div><div class=wm>SALIS</div><h1>تطبيق الشحن</h1><p class=mut>${x(msg||'سجّل دخول بالاسم وكلمة السر اللي اتعملتلك')}</p>
 <div class=card><label>الاسم<input id=nm autocomplete=username maxlength=60></label><br><label>كلمة السر<input id=pw type=password autocomplete=current-password dir=ltr maxlength=72></label>
 <div class=row><button class=btn id=go style="flex:1">دخول</button></div></div></div>`;
 const go=async()=>{const b=$('#go');b.disabled=true;const{data,error}=await db.rpc('ship_login',{p_name:$('#nm').value,p_password:$('#pw').value});b.disabled=false;
  if(error)return toast('تعذّر الاتصال، جرّب تاني',1);if(data.error)return toast(data.error,1);
  S.tok=data.token;S.name=data.name;ls.set('salis_ship_tok',S.tok);ls.set('salis_ship_name',S.name);S.seen=false;boot()};
 $('#go').onclick=go;$('#pw').onkeydown=e=>e.key=='Enter'&&go();
}
async function logout(expired){if(S.tok)db.rpc('ship_logout',{t:S.tok}).then(()=>{},()=>{});S.tok=null;S.orders=[];ls.del('salis_ship_tok');ls.del('salis_ship_name');login(expired?'انتهت الجلسة، سجّل دخول تاني':'')}

/* ---------- الشاشة الرئيسية ---------- */
function boot(){
 if(!S.tok)return login();
 $('#app').innerHTML=`<header><div class=logo>${LOGO(26)}</div><div class=bt><b>SALIS</b><small>تطبيق الشحن · ${x(S.name)}</small></div><button class=ib data-act=refresh aria-label=تحديث title=تحديث>${icn('refresh')}</button><button class=ib data-act=out aria-label="تسجيل الخروج" title="تسجيل الخروج">${icn('out')}</button></header>
 <main><div class=chips id=chips></div><input id=sq placeholder="ابحث برقم الطلب SL-0012 أو الاسم أو الموبايل" value="${x(S.q)}"><div id=ol></div></main>`;
 $('#sq').oninput=e=>{S.q=e.target.value;list()};
 load();
}
async function load(silent){const{data,error}=await db.rpc('ship_orders',{t:S.tok});
 if(error){if(!silent)toast('تعذّر التحميل — تأكد من النت',1);return false}
 if(data===null){logout(true);return false}
 const had=new Set(S.orders.map(o=>o.id)),fresh=S.seen?data.filter(o=>!had.has(o.id)&&['new','confirmed'].includes(o.status)):[];
 S.orders=data;S.seen=true;if(fresh.length)toast('🔔 طلب جديد: '+fresh.map(o=>oc(o.id)).join('، '));draw();return true}
function draw(){const c=s=>S.orders.filter(o=>o.status==s).length;
 const el=$('#chips');if(!el)return;el.innerHTML=TABS.map(t=>`<button class="chip${S.tab==t[0]?' on':''}" data-tab=${t[0]}>${t[1]} (${c(t[0])})</button>`).join('');list()}
function msg(o){const items=o.items.map(i=>`- ${i.name} (${i.size}${i.color?' / '+i.color:''}) × ${i.qty} — ${i.price*i.qty} ج.م`).join('\n');
 return `أهلاً ${o.customer_name} 🌿\nمعاك سَلِسْ — بنأكد طلبك:\n\n🧾 كود الطلب: ${oc(o.id)}\n${o.customer_code?`🆔 كود العميل: ${o.customer_code}\n`:''}👤 الاسم: ${o.customer_name}\n📞 الموبايل: ${o.customer_phone}\n📍 العنوان: ${o.governorate?o.governorate+' — ':''}${o.customer_address}\n\n🛍️ المنتجات:\n${items}\n\nالمجموع: ${o.subtotal} ج.م${o.discount?`\nالخصم${o.coupon_code?' ('+o.coupon_code+')':''}: -${o.discount} ج.م`:''}\nالشحن: ${o.shipping_fee?o.shipping_fee+' ج.م':'مجاني'}\n💰 المطلوب تحصيله عند الاستلام: ${o.total_amount} ج.م\n\nمن فضلك رد بكلمة "تأكيد" لو كل البيانات صح، أو ابعتلنا التعديل المطلوب. شكراً لثقتك 🌿`}
function copyTxt(o){return `${oc(o.id)}${o.customer_code?' ('+o.customer_code+')':''}\nالاسم: ${o.customer_name}\nالموبايل: ${o.customer_phone}\nالمحافظة: ${o.governorate||'-'}\nالعنوان: ${o.customer_address}\n`+o.items.map(i=>`- ${i.name} (${i.size}${i.color?' / '+i.color:''}) × ${i.qty}`).join('\n')+`\nالمطلوب تحصيله: ${o.total_amount} جنيه`+(o.notes?`\nملاحظات: ${o.notes}`:'')}
function card(o){const[st,c]=ST[o.status]||[o.status,'#888'],op=S.open==o.id,
 waBtn=`<a class="btn w${o.status=='new'?' big':''}" href="${x(wa(o.customer_phone))+'?text='+encodeURIComponent(msg(o))}" target=_blank rel=noopener>💬 ${o.status=='new'?'تواصل واتساب لتأكيد الأوردر':'واتساب'}</a>`;
 const acts={new:`${waBtn}<button class="btn big" data-act=set data-id=${o.id} data-to=confirmed>✅ تأكيد الأوردر</button>`,
  confirmed:`${waBtn}<button class="btn big" data-act=set data-id=${o.id} data-to=shipped>📦 تم الشحن</button>`,
  shipped:`${waBtn}<button class="btn big" data-act=set data-id=${o.id} data-to=delivered>✅ تم التسليم</button><button class="btn s" data-act=set data-id=${o.id} data-to=confirmed>↩ رجوع لمؤكد</button>`,
  delivered:`<button class="btn s" data-act=set data-id=${o.id} data-to=shipped>↩ رجوع لـ في الشحن</button>`,
  cancelled:`<p class=mut style="margin:0">الطلب ده اتلغى — متشحنهوش.</p>`}[o.status]||'';
 return `<article class=card><div data-act=tog data-id=${o.id} style="cursor:pointer"><div class=top><span class=code>${oc(o.id)}${o.customer_code?` <span class=mut>· ${x(o.customer_code)}</span>`:''}</span><span class=pill style="background:${c}">${st}</span></div>
 <div style="margin-top:4px"><b>${x(o.customer_name)}</b> — <span dir=ltr>${x(o.customer_phone)}</span></div>
 <div class=mut>📍 ${o.governorate?x(o.governorate)+' — ':''}${x(o.customer_address)}</div><div class=mut>${when(o.created_at)}</div>
 <div class=cash><span>المطلوب تحصيله</span><b>${M(o.total_amount)}</b></div></div>
 ${op?`<div class=bd>${o.items.map(i=>`<div class=ln><span>${x(i.name)}<br><small class=mut>${x(i.size)}${i.color?' — '+x(i.color):''}</small></span><span>× ${Number(i.qty)||0}</span><span>${M(i.price*i.qty)}</span></div>`).join('')}
 <div class=ln><span>المجموع</span><span></span><span>${M(o.subtotal)}</span></div>${o.discount?`<div class=ln><span>خصم ${x(o.coupon_code||'')}</span><span></span><span>-${M(o.discount)}</span></div>`:''}<div class=ln><span>الشحن</span><span></span><span>${o.shipping_fee?M(o.shipping_fee):'مجاني'}</span></div>
 ${o.notes?`<p class=mut>📝 ${x(o.notes)}</p>`:''}<p class=mut>${o.confirmed_at?'تأكيد: '+when(o.confirmed_at)+' · ':''}${o.shipped_at?'شحن: '+when(o.shipped_at)+' · ':''}${o.delivered_at?'تسليم: '+when(o.delivered_at):''}</p>
 <div class=row><button class="btn s" data-act=copy data-id=${o.id}>📋 نسخ بيانات الشحن</button><a class="btn s" href="tel:${x(String(o.customer_phone).replace(/[^\d+]/g,''))}">📞 اتصال</a></div></div>`:''}
 <div class=row>${acts}</div></article>`}
function list(){const q=S.q.trim().toLowerCase().replace(/^sl-?0*/,''),
 L=S.orders.filter(o=>o.status==S.tab&&(!q||`${o.id} ${oc(o.id)} ${o.customer_name} ${o.customer_phone} ${o.customer_code||''}`.toLowerCase().includes(q)));
 const el=$('#ol');if(el)el.innerHTML=L.map(card).join('')||'<p class=mut style="text-align:center;margin-top:30px">مفيش طلبات هنا.</p>'}
async function setSt(id,to){const o=S.orders.find(o=>o.id==id);if(!o||S.busy)return;
 const m={confirmed:o.status=='new'?'تأكيد الطلب '+oc(id)+'؟':'رجوع الطلب '+oc(id)+' لحالة "مؤكد"؟',shipped:o.status=='delivered'?'رجوع الطلب '+oc(id)+' لحالة "في الشحن"؟':'تأكيد إن الطلب '+oc(id)+' اتشحن؟',delivered:'تأكيد إن الطلب '+oc(id)+' اتسلّم وتم تحصيل '+M(o.total_amount)+'؟'}[to];
 if(!confirm(m))return;S.busy=true;
 const{data,error}=await db.rpc('ship_set_status',{t:S.tok,p_id:id,p_to:to});S.busy=false;
 if(error)return toast('تعذّر الحفظ — جرّب تاني',1);
 if(data.error){toast(data.error,1);return load(true)}
 toast('تم التحديث ✓');await load(true)}
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-tab]');if(t){S.tab=t.dataset.tab;return draw()}
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=+b.dataset.id;
 if(a=='tog'){S.open=S.open==id?null:id;return list()}
 if(a=='set')return setSt(id,b.dataset.to);
 if(a=='copy'){const o=S.orders.find(o=>o.id==id);try{await navigator.clipboard.writeText(copyTxt(o));toast('تم نسخ بيانات الشحن')}catch(er){toast('النسخ مش متاح على المتصفح ده',1)}return}
 if(a=='refresh'){toast('جاري التحديث…');return load()}
 if(a=='out'){if(confirm('تسجيل الخروج؟'))logout()}
});
setInterval(()=>{if(S.tok&&!document.hidden&&!S.busy&&$('#ol'))load(true)},30000);
if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(r=>r.forEach(g=>g.unregister())).catch(()=>{});
boot();
</script>
</body>
</html>
